name: Bot Solo 3 - Syndicator RSS & Indexador Rápido

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  syndicate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas necessárias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Bot 3 (Syndicator RSS)
        run: python bot_rss_syndicator.py

      - name: Salvar histórico de execução
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historico_sindicacao.json || true
          git commit -m "chore: atualiza historico de jogos sindicados [skip ci]" || true
          git push || true

name: Bot Solo 2 - Pinterest Auto-Pinner (Google Imagens)

on:
  schedule:
    # Executa diariamente as 12:00 UTC (9:00 Horario de Brasilia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite disparo manual via painel do GitHub

jobs:
  pinterest-pinning:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v3

      - name: Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar biblioteca Requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Bot Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: python bot_pinterest.py

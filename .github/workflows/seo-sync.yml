name: Sincronizar Descricoes SEO

on:
  schedule:
    - cron: '0 */12 * * *' # Roda a cada 12 horas automaticamente
  workflow_dispatch: # Permite rodar manualmente quando quiser

jobs:
  atualizar-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar Dependencias
        run: npm install axios googleapis

      - name: Executar Atualizador de SEO
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: node atualizador-seo.js

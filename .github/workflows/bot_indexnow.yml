name: Bot Solo 1 - IndexNow (Bing e Yandex)

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite rodar manualmente no botao se quiser

jobs:
  indexar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar Bot IndexNow
        run: python bot_indexnow.py
